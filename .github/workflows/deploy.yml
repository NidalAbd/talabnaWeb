name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application files (excluding public)
        uses: SamKirkland/FTP-Deploy-Action@4.3.4
        with:
          server: talbna.cloud
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /domains/talbna.cloud/
          exclude: |
            public/**
            .git/**
            .github/**
            .gitignore
            .env
            .env.example
            node_modules/**
            tests/**
            storage/logs/**
            .idea/**
            *.log
            .DS_Store
            Thumbs.db

      - name: Deploy public files only
        uses: SamKirkland/FTP-Deploy-Action@4.3.4
        with:
          server: talbna.cloud
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: /domains/talbna.cloud/public_html/
