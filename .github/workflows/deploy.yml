name: Deploy Laravel to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            cd /domains/talbna.cloud/

            # Pull latest changes
            git pull origin main

            # Install/update dependencies
            composer install --no-dev --optimize-autoloader

            # Copy Laravel's public folder contents to public_html
            cp -r public/* public_html/

            # Update public_html/index.php paths
            sed -i 's|__DIR__.*vendor|__DIR__."/../vendor"|g' public_html/index.php
            sed -i 's|__DIR__.*bootstrap|__DIR__."/../bootstrap"|g' public_html/index.php

            # Set permissions
            chmod -R 755 public_html/
            chmod -R 775 storage/
            chmod -R 775 bootstrap/cache/

            # Laravel optimizations
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
