name: Deploy Laravel to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Prepare deployment files
        run: |
          # Create temporary directory structure
          mkdir -p deploy_temp/public_html

          # Copy all Laravel files except public and unnecessary folders
          rsync -av --exclude='public' --exclude='node_modules' --exclude='.git' --exclude='deploy_temp' --exclude='.env' ./ deploy_temp/

          # Copy public folder contents to public_html
          cp -r public/* deploy_temp/public_html/

          # Fix index.php paths to point to Laravel directories
          sed -i "s|require __DIR__\.'/../vendor/autoload.php';|require __DIR__\.'/../vendor/autoload.php';|g" deploy_temp/public_html/index.php
          sed -i "s|\$app = require_once __DIR__\.'/../bootstrap/app.php';|\$app = require_once __DIR__\.'/../bootstrap/app.php';|g" deploy_temp/public_html/index.php

          # Create production .env file
          cp .env.example deploy_temp/.env

          # Generate application key
          cd deploy_temp && php artisan key:generate --no-interaction

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.talbna.cloud
          username: u693675641
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_temp/
          server-dir: ./domains/talbna.cloud/
          exclude: |
            .git*
            .git*/**
            node_modules/**
            .github/**
            tests/**
            *.md
