name: Deploy Laravel to Hostinger (Talbna)

# DEPLOYMENT OPTIMIZATIONS:
# - vendor directory is uploaded manually via SSH (not included in FTP deployment)
# - This significantly reduces deployment time and avoids timeout issues
# - composer.lock should be committed to ensure consistent dependencies
#
# MANUAL STEPS REQUIRED:
# 1. Upload vendor directory via SSH after first deployment or when dependencies change:
#    scp -r ./vendor u252000670.talbna.cloud@82.198.227.208:/domains/talbna.cloud/
#    OR use rsync for faster incremental uploads:
#    rsync -avz --progress ./vendor/ u252000670.talbna.cloud@82.198.227.208:/domains/talbna.cloud/vendor/

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PHP setup removed - vendor will be uploaded manually via SSH
      # This significantly speeds up deployment and avoids timeout issues

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
          else
            echo "No package.json found, skipping..."
          fi

      - name: Build assets
        run: |
          if [ -f "vite.config.js" ] || [ -f "vite.config.mjs" ]; then
            npm run build
          elif [ -f "webpack.mix.js" ]; then
            npm run production || npm run prod
          else
            echo "No build config found, skipping..."
          fi

      - name: Create deployment structure
        run: |
          # Create two separate deployment directories
          mkdir -p deploy_laravel  # For Laravel files (goes to domain root)
          mkdir -p deploy_public   # For public files (goes to public_html)

      - name: Prepare Laravel files (outside public_html)
        run: |
          # Copy all Laravel files EXCEPT public folder and vendor (uploaded manually via SSH)
          rsync -av \
            --exclude='public' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='deploy_laravel' \
            --exclude='deploy_public' \
            --exclude='tests' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='phpunit.xml' \
            --exclude='vite.config.js' \
            --exclude='vite.config.mjs' \
            --exclude='webpack.mix.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.editorconfig' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            ./ deploy_laravel/

      - name: Prepare public files (for public_html)
        run: |
          # Copy public folder contents to deploy_public
          if [ -d "public" ]; then
            cp -r public/* deploy_public/ 2>/dev/null || true
            cp -r public/.[^.]* deploy_public/ 2>/dev/null || true
          fi

          # Remove any existing storage symlink
          if [ -L "deploy_public/storage" ]; then
            rm deploy_public/storage
          elif [ -d "deploy_public/storage" ]; then
            rm -rf deploy_public/storage
          fi

      - name: Update index.php for correct paths
        run: |
          # Paths remain the same since Laravel files will be one level up from public_html
          echo "✓ index.php paths are correct for shared hosting structure"

      - name: Update environment for production
        run: |
          cd deploy_laravel

          # Create .env from .env.example if it doesn't exist
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            # Create a basic .env file if neither exists
            touch .env
          fi

          # Update .env for production
          sed -i 's/APP_ENV=local/APP_ENV=production/' .env
          sed -i 's/APP_DEBUG=true/APP_DEBUG=false/' .env
          sed -i 's|APP_URL=.*|APP_URL=https://talbna.cloud|' .env
          sed -i 's/LOG_LEVEL=debug/LOG_LEVEL=error/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env

          # Update database settings for talbna
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=u252000670_talbna/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=u252000670_talbna/' .env

          # Set database password from GitHub secret
          if [ ! -z "${{ secrets.DB_PASSWORD }}" ]; then
            sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/" .env
          fi

          # Set APP_KEY if provided
          if [ ! -z "${{ secrets.APP_KEY }}" ]; then
            sed -i "s/APP_KEY=.*/APP_KEY=${{ secrets.APP_KEY }}/" .env
          fi

      - name: Create post-deployment script
        run: |
          cat > deploy_public/setup_storage.php << 'EOF'
          <?php
          error_reporting(E_ALL);
          ini_set('display_errors', 1);

          echo "<pre>";
          echo "Starting post-deployment setup for Talbna...\n";
          echo "============================================\n\n";

          $laravelPath = dirname(__DIR__); // One level up from public_html
          $publicPath = __DIR__;
          $storagePath = $laravelPath . '/storage/app/public';

          // Change to Laravel directory for artisan commands
          chdir($laravelPath);

          // Clear Laravel caches
          echo "Step 1: Clearing Laravel caches...\n";
          $commands = [
              'php artisan config:clear' => 'Configuration cache',
              'php artisan cache:clear' => 'Application cache',
              'php artisan view:clear' => 'View cache',
              'php artisan route:clear' => 'Route cache',
              'php artisan optimize:clear' => 'Optimization cache'
          ];

          foreach ($commands as $command => $description) {
              $output = shell_exec("$command 2>&1");
              echo "  ✓ Cleared: $description\n";
          }

          // Remove existing storage link/directory
          echo "\nStep 2: Setting up storage link...\n";
          $storageLink = $publicPath . '/storage';

          if (file_exists($storageLink)) {
              if (is_link($storageLink)) {
                  unlink($storageLink);
                  echo "  Removed existing storage symlink\n";
              } elseif (is_dir($storageLink)) {
                  // Remove directory recursively
                  $files = array_diff(scandir($storageLink), array('.', '..'));
                  foreach ($files as $file) {
                      $path = "$storageLink/$file";
                      is_dir($path) ? rmdir($path) : unlink($path);
                  }
                  rmdir($storageLink);
                  echo "  Removed existing storage directory\n";
              }
          }

          // Create storage directories if they don't exist
          if (!file_exists($storagePath)) {
              mkdir($storagePath, 0755, true);
              echo "  Created storage/app/public directory\n";
          }

          // Create the symlink
          if (symlink($storagePath, $storageLink)) {
              echo "  ✅ Storage symlink created successfully!\n";
              echo "  Link: public_html/storage -> ../storage/app/public\n";
          } else {
              echo "  ❌ Failed to create storage symlink\n";
              echo "  Please run manually: php artisan storage:link\n";
          }

          // Check if APP_KEY is set
          echo "\nStep 3: Checking application key...\n";
          $envContent = file_get_contents($laravelPath . '/.env');
          if (strpos($envContent, 'APP_KEY=base64:') === false) {
              echo "  Generating application key...\n";
              shell_exec('php artisan key:generate --force 2>&1');
              echo "  ✓ Application key generated\n";
          } else {
              echo "  ✓ Application key already set\n";
          }

          echo "\n============================================\n";
          echo "✅ Post-deployment setup completed!\n";
          echo "============================================\n";
          echo "</pre>";

          // Delete this script after execution for security
          @unlink(__FILE__);
          EOF

      - name: Set proper permissions
        run: |
          # Laravel files
          find deploy_laravel -type f -exec chmod 644 {} \;
          find deploy_laravel -type d -exec chmod 755 {} \;
          chmod -R 775 deploy_laravel/storage deploy_laravel/bootstrap/cache 2>/dev/null || true

          # Public files
          find deploy_public -type f -exec chmod 644 {} \;
          find deploy_public -type d -exec chmod 755 {} \;

      - name: Create .htaccess files
        run: |
          # Create .htaccess for Laravel root (security)
          cat > deploy_laravel/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteRule ^(.*)$ public_html/$1 [L]
          </IfModule>

          # Protect sensitive files
          <FilesMatch "^\.env">
              Order allow,deny
              Deny from all
          </FilesMatch>
          EOF

          # Create .htaccess for public_html
          cat > deploy_public/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
              <IfModule mod_negotiation.c>
                  Options -MultiViews -Indexes
              </IfModule>

              RewriteEngine On

              # Force HTTPS
              RewriteCond %{HTTPS} off
              RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

              # Handle Authorization Header
              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              # Redirect Trailing Slashes If Not A Folder
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_URI} (.+)/$
              RewriteRule ^ %1 [L,R=301]

              # Send Requests To Front Controller
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
          </IfModule>

          # Security headers
          <IfModule mod_headers.c>
              Header set X-Content-Type-Options "nosniff"
              Header set X-Frame-Options "SAMEORIGIN"
              Header set X-XSS-Protection "1; mode=block"
          </IfModule>
          EOF

      - name: Verify deployment structure
        run: |
          echo "📋 Deployment Structure Verification"
          echo "====================================="
          echo ""
          echo "Laravel files (deploy_laravel/):"
          ls -la deploy_laravel/ | head -10
          echo ""
          echo "Public files (deploy_public/):"
          ls -la deploy_public/ | head -10
          echo ""
          echo "Critical files check:"
          [ -f "deploy_laravel/.env" ] && echo "✅ .env exists" || echo "⚠️ .env missing (will use existing)"
          [ -f "deploy_laravel/artisan" ] && echo "✅ artisan exists" || echo "❌ artisan missing"
          echo "ℹ️ vendor directory uploaded separately via SSH (not in this deployment)"
          [ -f "deploy_public/index.php" ] && echo "✅ index.php exists" || echo "❌ index.php missing"

      - name: Deploy Laravel files to domain root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 82.198.227.208
          username: u252000670.talbna.cloud
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./deploy_laravel/
          server-dir: ./domains/talbna.cloud/
          exclude: |
            vendor/**
            public/**
            public_html/**
            .git*
            .git*/**
            node_modules/**
            tests/**
          log-level: verbose
          dangerous-clean-slate: false

      - name: Deploy public files to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 82.198.227.208
          username: u252000670.talbna.cloud
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./deploy_public/
          server-dir: ./domains/talbna.cloud/public_html/
          log-level: verbose
          dangerous-clean-slate: false

      - name: Run post-deployment setup
        run: |
          echo "⏳ Waiting for files to sync..."
          sleep 10

          echo "🔧 Running post-deployment setup..."
          response=$(curl -s -w "\nHTTPSTATUS:%{http_code}" https://talbna.cloud/setup_storage.php)
          http_code=$(echo "$response" | grep "HTTPSTATUS" | cut -d':' -f2)

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 404 ]; then
            echo "✅ Setup script executed successfully!"
            echo "(404 is expected as the script deletes itself after running)"
          else
            echo "⚠️ Setup returned HTTP $http_code - may need manual check"
            echo "You can try running: https://talbna.cloud/setup_storage.php"
          fi

      - name: Test deployment
        run: |
          echo "🧪 Testing deployment..."
          sleep 5

          site_status=$(curl -s -o /dev/null -w "%{http_code}" https://talbna.cloud)

          if [ "$site_status" -eq 200 ] || [ "$site_status" -eq 301 ] || [ "$site_status" -eq 302 ]; then
            echo "✅ Site is accessible (HTTP $site_status)"
            echo "🎉 Deployment completed successfully!"
            echo "📌 Visit: https://talbna.cloud"
          else
            echo "⚠️ Site returned HTTP $site_status"
            echo "This might be normal if authentication is required"
            echo "Check the site manually: https://talbna.cloud"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf deploy_laravel deploy_public
          echo "✅ Cleanup completed!"
