name: Deploy Laravel to Hostinger - talbna.cloud

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Create deployment archive
        run: |
          # Create archive excluding unnecessary files
          tar -czf deploy.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vendor' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            .

      - name: Deploy via SSH/SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          source: "deploy.tar.gz"
          target: "/home/u252000670/domains/talbna.cloud/"
          timeout: 300s

      - name: Extract and setup on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          timeout: 300s
          script: |
            cd /home/u252000670/domains/talbna.cloud

            echo "📦 Extracting deployment archive..."
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            echo "📦 Running composer install..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🔗 Creating storage symlink..."
            if [ -e public_html/storage ]; then
                rm -f public_html/storage
            fi
            ln -s /home/u252000670/domains/talbna.cloud/storage/app/public public_html/storage

            echo "📁 Copying public files..."
            cp -r public/* public_html/

            echo "🧹 Clearing caches..."
            php artisan config:clear
            php artisan cache:clear
            php artisan view:clear
            php artisan route:clear

            echo "🔒 Setting permissions..."
            chmod -R 755 storage bootstrap/cache

            echo "✅ Deployment completed!"
